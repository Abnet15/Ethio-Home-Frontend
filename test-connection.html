<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Home - Connection Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }
        .status-card.success {
            border-left-color: #28a745;
        }
        .status-card.error {
            border-left-color: #dc3545;
        }
        .status-card.warning {
            border-left-color: #ffc107;
        }
        .status-card h3 {
            margin-bottom: 10px;
            color: #333;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-indicator.success {
            background: #28a745;
        }
        .status-indicator.error {
            background: #dc3545;
        }
        .status-indicator.warning {
            background: #ffc107;
        }
        .endpoint-list {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .endpoint-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .endpoint-item.success {
            border-left: 4px solid #28a745;
        }
        .endpoint-item.error {
            border-left: 4px solid #dc3545;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }
        .log-entry.success {
            color: #4ec9b0;
        }
        .log-entry.error {
            color: #f48771;
        }
        .log-entry.info {
            color: #569cd6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Ethio Home - Connection Test</h1>
        <p class="subtitle">Testing Backend API and Frontend Connectivity</p>
        
        <div class="status-grid">
            <div class="status-card" id="backend-status">
                <h3>
                    <span class="status-indicator" id="backend-indicator"></span>
                    Backend API
                </h3>
                <p id="backend-message">Not tested</p>
            </div>
            
            <div class="status-card" id="socket-status">
                <h3>
                    <span class="status-indicator" id="socket-indicator"></span>
                    WebSocket
                </h3>
                <p id="socket-message">Not tested</p>
            </div>
            
            <div class="status-card" id="frontend-status">
                <h3>
                    <span class="status-indicator" id="frontend-indicator"></span>
                    Frontend
                </h3>
                <p id="frontend-message">Ready</p>
            </div>
        </div>
        
        <div style="text-align: center; margin: 20px 0;">
            <button onclick="testAll()">🔍 Test All Connections</button>
            <button onclick="testEndpoints()">📡 Test API Endpoints</button>
            <button onclick="testSocket()">🔌 Test WebSocket</button>
            <button onclick="clearLog()">🗑️ Clear Log</button>
        </div>
        
        <div class="endpoint-list" id="endpoint-list" style="display: none;">
            <h3>API Endpoints Status</h3>
            <div id="endpoints"></div>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script type="module">
        const API_BASE_URL = 'http://localhost:5000/api/v1';
        const SOCKET_URL = 'http://localhost:5000';
        
        let logContainer = document.getElementById('log');
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(cardId, indicatorId, messageId, status, message) {
            const card = document.getElementById(cardId);
            const indicator = document.getElementById(indicatorId);
            const messageEl = document.getElementById(messageId);
            
            card.className = `status-card ${status}`;
            indicator.className = `status-indicator ${status}`;
            messageEl.textContent = message;
        }
        
        async function testBackend() {
            log('Testing backend API connection...', 'info');
            try {
                const response = await fetch(`${API_BASE_URL}/properties`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    updateStatus('backend-status', 'backend-indicator', 'backend-message', 'success', 'Connected ✓');
                    log('✅ Backend API is reachable', 'success');
                    return true;
                } else {
                    updateStatus('backend-status', 'backend-indicator', 'backend-message', 'warning', `Status: ${response.status}`);
                    log(`⚠️ Backend responded with status: ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                updateStatus('backend-status', 'backend-indicator', 'backend-message', 'error', 'Connection Failed');
                log(`❌ Backend connection failed: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function testSocket() {
            log('Testing WebSocket connection...', 'info');
            updateStatus('socket-status', 'socket-indicator', 'socket-message', 'warning', 'Connecting...');
            
            return new Promise((resolve) => {
                try {
                    // Import socket.io-client dynamically
                    import('https://cdn.socket.io/4.8.1/socket.io.esm.min.js').then(({ io }) => {
                        const socket = io(SOCKET_URL, {
                            transports: ['websocket', 'polling'],
                            timeout: 5000
                        });
                        
                        socket.on('connect', () => {
                            updateStatus('socket-status', 'socket-indicator', 'socket-message', 'success', 'Connected ✓');
                            log('✅ WebSocket connected successfully', 'success');
                            socket.disconnect();
                            resolve(true);
                        });
                        
                        socket.on('connect_error', (error) => {
                            updateStatus('socket-status', 'socket-indicator', 'socket-message', 'error', 'Connection Failed');
                            log(`❌ WebSocket connection failed: ${error.message}`, 'error');
                            resolve(false);
                        });
                        
                        setTimeout(() => {
                            if (!socket.connected) {
                                updateStatus('socket-status', 'socket-indicator', 'socket-message', 'error', 'Timeout');
                                log('❌ WebSocket connection timeout', 'error');
                                socket.disconnect();
                                resolve(false);
                            }
                        }, 5000);
                    }).catch(error => {
                        updateStatus('socket-status', 'socket-indicator', 'socket-message', 'error', 'Failed to load socket.io');
                        log(`❌ Failed to load socket.io: ${error.message}`, 'error');
                        resolve(false);
                    });
                } catch (error) {
                    updateStatus('socket-status', 'socket-indicator', 'socket-message', 'error', 'Error');
                    log(`❌ WebSocket test error: ${error.message}`, 'error');
                    resolve(false);
                }
            });
        }
        
        async function testEndpoints() {
            log('Testing API endpoints...', 'info');
            document.getElementById('endpoint-list').style.display = 'block';
            const endpointsDiv = document.getElementById('endpoints');
            endpointsDiv.innerHTML = '';
            
            const endpoints = [
                { method: 'GET', path: '/properties', auth: false },
                { method: 'GET', path: '/users', auth: false },
                { method: 'GET', path: '/reviews', auth: false },
                { method: 'GET', path: '/messages', auth: true },
                { method: 'GET', path: '/notifications', auth: true },
            ];
            
            for (const endpoint of endpoints) {
                const item = document.createElement('div');
                item.className = 'endpoint-item';
                item.innerHTML = `
                    <span><strong>${endpoint.method}</strong> ${endpoint.path}</span>
                    <span id="status-${endpoint.path.replace(/\//g, '-')}">Testing...</span>
                `;
                endpointsDiv.appendChild(item);
                
                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint.path}`, {
                        method: endpoint.method,
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const statusEl = document.getElementById(`status-${endpoint.path.replace(/\//g, '-')}`);
                    if (response.ok || response.status === 401) {
                        item.className = 'endpoint-item success';
                        statusEl.textContent = `✓ ${response.status}`;
                        log(`✅ ${endpoint.method} ${endpoint.path} - ${response.status}`, 'success');
                    } else {
                        item.className = 'endpoint-item error';
                        statusEl.textContent = `✗ ${response.status}`;
                        log(`❌ ${endpoint.method} ${endpoint.path} - ${response.status}`, 'error');
                    }
                } catch (error) {
                    item.className = 'endpoint-item error';
                    const statusEl = document.getElementById(`status-${endpoint.path.replace(/\//g, '-')}`);
                    statusEl.textContent = '✗ Error';
                    log(`❌ ${endpoint.method} ${endpoint.path} - ${error.message}`, 'error');
                }
                
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            log('✅ Endpoint testing completed', 'success');
        }
        
        async function testAll() {
            log('🚀 Starting comprehensive connection test...', 'info');
            updateStatus('frontend-status', 'frontend-indicator', 'frontend-message', 'success', 'Testing...');
            
            const backendOk = await testBackend();
            await new Promise(resolve => setTimeout(resolve, 1000));
            const socketOk = await testSocket();
            
            if (backendOk && socketOk) {
                updateStatus('frontend-status', 'frontend-indicator', 'frontend-message', 'success', 'All Tests Passed ✓');
                log('✅ All connection tests passed!', 'success');
            } else {
                updateStatus('frontend-status', 'frontend-indicator', 'frontend-message', 'warning', 'Some Tests Failed');
                log('⚠️ Some connection tests failed', 'error');
            }
        }
        
        function clearLog() {
            logContainer.innerHTML = '';
            log('Log cleared', 'info');
        }
        
        // Make functions available globally
        window.testAll = testAll;
        window.testEndpoints = testEndpoints;
        window.testSocket = testSocket;
        window.clearLog = clearLog;
        
        // Auto-test on load
        log('Connection test page loaded', 'info');
        log('Click "Test All Connections" to start testing', 'info');
    </script>
</body>
</html>
